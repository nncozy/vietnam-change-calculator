<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="お釣り計算">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<title>お釣り計算 - ベトナム旅行用</title>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-alt: #eae4d6;
    --text: #1e1c18;
    --text-muted: #6f6656;
    --accent: #2f7a6b;
    --jpy: #45538c;
    --mmk: #a9821f;
    --vnd: #b0432c;
    --danger: #b3261e;
    --border: rgba(30, 28, 24, 0.14);
    --key-bg: #ffffff;
    --key-shadow: rgba(30, 28, 24, 0.08);
    --chip-bg: #eae4d6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210;
      --surface: #1d1b17;
      --surface-alt: #27241e;
      --text: #f1ede4;
      --text-muted: #a89e8c;
      --accent: #5cb3a0;
      --jpy: #8291c9;
      --mmk: #e0bd57;
      --vnd: #e08066;
      --danger: #ef5350;
      --border: rgba(241, 237, 228, 0.16);
      --key-bg: #27241e;
      --key-shadow: rgba(0, 0, 0, 0.35);
      --chip-bg: #2d2a23;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131210;
    --surface: #1d1b17;
    --surface-alt: #27241e;
    --text: #f1ede4;
    --text-muted: #a89e8c;
    --accent: #5cb3a0;
    --jpy: #8291c9;
    --mmk: #e0bd57;
    --vnd: #e08066;
    --danger: #ef5350;
    --border: rgba(241, 237, 228, 0.16);
    --key-bg: #27241e;
    --key-shadow: rgba(0, 0, 0, 0.35);
    --chip-bg: #2d2a23;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-alt: #eae4d6;
    --text: #1e1c18;
    --text-muted: #6f6656;
    --accent: #2f7a6b;
    --jpy: #45538c;
    --mmk: #a9821f;
    --vnd: #b0432c;
    --danger: #b3261e;
    --border: rgba(30, 28, 24, 0.14);
    --key-bg: #ffffff;
    --key-shadow: rgba(30, 28, 24, 0.08);
    --chip-bg: #eae4d6;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 460px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .topbar h1 {
    font-size: 19px;
    font-weight: 800;
    margin: 0;
    line-height: 1.3;
  }
  .topbar .subtitle {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    cursor: pointer;
  }
  .icon-btn:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .panel h2 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0;
    font-weight: 800;
  }

  .total-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .currency-switch {
    display: flex;
    gap: 6px;
  }
  .curr-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .curr-btn.active {
    background: var(--accent);
    color: var(--surface);
    border-color: var(--accent);
  }

  .rates-toggle {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 44px;
    padding: 0;
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    text-align: left;
    cursor: pointer;
  }
  .rates-toggle .chevron {
    font-size: 13px;
    color: var(--text-muted);
    transition: transform 0.2s ease;
  }
  .rates-toggle[aria-expanded="true"] .chevron {
    transform: rotate(180deg);
  }
  @media (prefers-reduced-motion: reduce) {
    .rates-toggle .chevron { transition: none; }
  }

  .rates-body[hidden] { display: none; }
  .rates-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rates-panel .note {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0;
  }
  .rates-panel label {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 14px;
  }
  .rates-panel input[type="number"] {
    width: 100px;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .hint-inline {
    font-size: 12px;
    color: var(--text-muted);
  }

  .big-display {
    text-align: center;
    padding: 6px 0 2px;
  }
  .big-display .row-main {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .big-display .sym {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-muted);
  }
  .big-display .num {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .conv-rows {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .conv-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .conv-row .flag { font-size: 15px; }
  .conv-row .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
  }
  .conv-row.jpy .num { color: var(--jpy); }
  .conv-row.mmk .num { color: var(--mmk); }
  .conv-row.vnd .num { color: var(--vnd); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .keypad button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--key-bg);
    color: var(--text);
    border-radius: 12px;
    font-size: 21px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    height: 54px;
    box-shadow: 0 1px 0 var(--key-shadow);
    cursor: pointer;
  }
  .keypad button:active { transform: translateY(1px); }
  .keypad button.fn { font-size: 15px; color: var(--text-muted); }
  .keypad button.zero { grid-column: span 3; }

  .bill-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .bill-grid button {
    appearance: none;
    border: 2px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 12px;
    height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .bill-grid .bill-amount {
    font-size: 16px;
    font-weight: 800;
  }
  .bill-grid .bill-jpy {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .bill-grid button:active { transform: translateY(1px); }

  .paid-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 14.5px;
  }
  .paid-summary strong {
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .paid-actions { display: flex; gap: 8px; }
  .ghost-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .ghost-btn:active { background: var(--surface-alt); }

  .paid-breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: var(--chip-bg);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .change-panel { align-items: stretch; }
  .change-status {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-muted);
    padding: 4px 0;
  }
  .change-status.danger { color: var(--danger); }

  .change-display .num { color: var(--accent); }

  .change-breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .change-breakdown .chip {
    background: color-mix(in srgb, var(--accent) 16%, var(--surface-alt));
    color: var(--accent);
  }

  .remainder-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin: 0;
  }

  .next-btn {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--surface);
    border-radius: 12px;
    height: 48px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .next-btn:active { opacity: 0.85; }

  .footnote {
    text-align: center;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 2px 0 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .keypad button:active,
    .bill-grid button:active { transform: none; }
  }
</style>

<div class="app">
  <header class="topbar">
    <h1>お釣り計算<span class="subtitle">ベトナム旅行用（円・チャット同時換算）</span></h1>
    <button id="themeToggle" class="icon-btn" aria-label="テーマ切替">🌙</button>
  </header>

  <section class="panel rates-panel" id="ratesPanel">
    <button class="rates-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="ratesBody">
      <span>為替レートを設定</span>
      <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div class="rates-body" id="ratesBody" hidden>
      <p class="note">目安レートです。出発前に必ず現地の実勢レートに直してください。ミャンマーは公定レートと実勢レートの差が大きいので特に注意してください。</p>
      <label>1 ドン = <input type="number" id="rateJpy" inputmode="decimal" step="0.0001" min="0"> 円 <span class="hint-inline" id="rateJpyHint"></span></label>
      <label>1 ドン = <input type="number" id="rateMmk" inputmode="decimal" step="0.001" min="0"> チャット <span class="hint-inline" id="rateMmkHint"></span></label>
    </div>
  </section>

  <section class="panel total-panel">
    <div class="total-panel-head">
      <h2>商品の値段</h2>
      <div class="currency-switch" id="currencySwitch" role="group" aria-label="入力する通貨を選択">
        <button type="button" class="curr-btn" data-currency="vnd">ドン</button>
        <button type="button" class="curr-btn" data-currency="jpy">円</button>
        <button type="button" class="curr-btn" data-currency="mmk">チャット</button>
      </div>
    </div>
    <div class="big-display">
      <div class="row-main"><span class="sym" id="totalFlag">🇻🇳</span><span class="num" id="totalNum">0</span><span class="sym" id="totalLabel">ドン</span></div>
      <div class="conv-rows">
        <div class="conv-row" id="convRow1"><span class="flag" id="convFlag1"></span><span class="num" id="convNum1">0</span><span class="label" id="convLabel1"></span></div>
        <div class="conv-row" id="convRow2"><span class="flag" id="convFlag2"></span><span class="num" id="convNum2">0</span><span class="label" id="convLabel2"></span></div>
      </div>
    </div>
    <div class="keypad" aria-label="商品の値段を入力">
      <button data-key="7" type="button">7</button>
      <button data-key="8" type="button">8</button>
      <button data-key="9" type="button">9</button>
      <button data-key="back" class="fn" type="button" aria-label="1桁削除">⌫</button>
      <button data-key="4" type="button">4</button>
      <button data-key="5" type="button">5</button>
      <button data-key="6" type="button">6</button>
      <button data-key="clear" class="fn" type="button" aria-label="クリア">C</button>
      <button data-key="1" type="button">1</button>
      <button data-key="2" type="button">2</button>
      <button data-key="3" type="button">3</button>
      <button data-key="000" class="fn" type="button">000</button>
      <button data-key="0" class="zero" type="button">0</button>
    </div>
  </section>

  <section class="panel paid-panel">
    <h2>支払う紙幣（ドン）</h2>
    <div class="bill-grid" id="billGrid"></div>
    <div class="paid-summary">
      <div>支払う合計: <strong id="paidTotal">0</strong> ₫</div>
      <div class="paid-actions">
        <button id="undoBtn" class="ghost-btn" type="button">1つ取り消す</button>
        <button id="resetPaidBtn" class="ghost-btn" type="button">支払いをクリア</button>
      </div>
    </div>
    <div class="paid-breakdown" id="paidBreakdown"></div>
  </section>

  <section class="panel change-panel">
    <h2>お釣り</h2>
    <div class="change-status" id="changeStatus">商品の値段を入力してください</div>
    <div class="big-display change-display" id="changeDisplay" hidden>
      <div class="row-main"><span class="num" id="changeNum">0</span><span class="sym">₫</span></div>
    </div>
    <div class="change-breakdown" id="changeBreakdown"></div>
    <p class="remainder-note" id="remainderNote" hidden></p>
    <button class="next-btn" id="nextBtn" type="button" hidden>次の会計へ（リセット）</button>
  </section>

  <p class="footnote">
    紙幣ボタンは、お店に渡す紙幣を選ぶためのものです。実際の組み合わせと異なる場合があります。通信不要、機内モードでも動作します。
  </p>
</div>

<script>
  (function () {
    var RATE_KEY = "vn-change-calc-rates-v2";
    var THEME_KEY = "vn-change-calc-theme-v1";
    var INPUT_CURRENCY_KEY = "vn-change-calc-input-currency-v1";

    var BILLS_VND = [500000, 200000, 100000, 50000, 20000, 10000, 5000, 2000, 1000];
    var billJpyEls = {};

    var state = {
      totalRaw: "",
      inputCurrency: "vnd",
      paidTaps: [],
      rates: { jpyPerVnd: 0.0060, mmkPerVnd: 0.170 }
    };

    var CURRENCIES = {
      vnd: {
        flag: "🇻🇳", label: "ドン",
        toVnd: function (v) { return v; },
        fromVnd: function (vnd) { return vnd; }
      },
      jpy: {
        flag: "🇯🇵", label: "円",
        toVnd: function (v) { return state.rates.jpyPerVnd > 0 ? v / state.rates.jpyPerVnd : 0; },
        fromVnd: function (vnd) { return vnd * state.rates.jpyPerVnd; }
      },
      mmk: {
        flag: "🇲🇲", label: "チャット",
        toVnd: function (v) { return state.rates.mmkPerVnd > 0 ? v / state.rates.mmkPerVnd : 0; },
        fromVnd: function (vnd) { return vnd * state.rates.mmkPerVnd; }
      }
    };
    var CURRENCY_ORDER = ["vnd", "jpy", "mmk"];

    var els = {
      themeToggle: document.getElementById("themeToggle"),
      settingsToggle: document.getElementById("settingsToggle"),
      ratesBody: document.getElementById("ratesBody"),
      rateJpy: document.getElementById("rateJpy"),
      rateMmk: document.getElementById("rateMmk"),
      rateJpyHint: document.getElementById("rateJpyHint"),
      rateMmkHint: document.getElementById("rateMmkHint"),
      currencySwitch: document.getElementById("currencySwitch"),
      totalFlag: document.getElementById("totalFlag"),
      totalLabel: document.getElementById("totalLabel"),
      totalNum: document.getElementById("totalNum"),
      convRow1: document.getElementById("convRow1"),
      convFlag1: document.getElementById("convFlag1"),
      convLabel1: document.getElementById("convLabel1"),
      convNum1: document.getElementById("convNum1"),
      convRow2: document.getElementById("convRow2"),
      convFlag2: document.getElementById("convFlag2"),
      convLabel2: document.getElementById("convLabel2"),
      convNum2: document.getElementById("convNum2"),
      billGrid: document.getElementById("billGrid"),
      paidTotal: document.getElementById("paidTotal"),
      paidBreakdown: document.getElementById("paidBreakdown"),
      undoBtn: document.getElementById("undoBtn"),
      resetPaidBtn: document.getElementById("resetPaidBtn"),
      changeStatus: document.getElementById("changeStatus"),
      changeDisplay: document.getElementById("changeDisplay"),
      changeNum: document.getElementById("changeNum"),
      changeBreakdown: document.getElementById("changeBreakdown"),
      remainderNote: document.getElementById("remainderNote"),
      nextBtn: document.getElementById("nextBtn")
    };

    function fmt(n) { return n.toLocaleString("ja-JP"); }

    function loadRates() {
      try {
        var saved = JSON.parse(localStorage.getItem(RATE_KEY));
        if (saved && typeof saved.jpyPerVnd === "number" && typeof saved.mmkPerVnd === "number") {
          state.rates = saved;
        }
      } catch (e) {}
    }
    function saveRates() {
      try { localStorage.setItem(RATE_KEY, JSON.stringify(state.rates)); } catch (e) {}
    }

    function loadInputCurrency() {
      try {
        var c = localStorage.getItem(INPUT_CURRENCY_KEY);
        if (CURRENCIES[c]) state.inputCurrency = c;
      } catch (e) {}
    }
    function saveInputCurrency() {
      try { localStorage.setItem(INPUT_CURRENCY_KEY, state.inputCurrency); } catch (e) {}
    }

    function loadTheme() {
      try {
        var t = localStorage.getItem(THEME_KEY);
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    }
    function currentIsDark() {
      var attr = document.documentElement.getAttribute("data-theme");
      if (attr === "dark") return true;
      if (attr === "light") return false;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function refreshThemeIcon() {
      els.themeToggle.textContent = currentIsDark() ? "☀" : "🌙";
    }

    function totalRawValue() {
      return state.totalRaw === "" ? 0 : parseInt(state.totalRaw, 10);
    }
    function totalVnd() {
      return Math.round(CURRENCIES[state.inputCurrency].toVnd(totalRawValue()));
    }
    function paidVnd() {
      return state.paidTaps.reduce(function (a, b) { return a + b; }, 0);
    }
    function toJpy(vnd) { return vnd * state.rates.jpyPerVnd; }
    function toMmk(vnd) { return vnd * state.rates.mmkPerVnd; }

    function greedyBreakdown(amount, bills) {
      var remaining = amount;
      var result = [];
      for (var i = 0; i < bills.length; i++) {
        var denom = bills[i];
        var count = Math.floor(remaining / denom);
        if (count > 0) {
          result.push({ denom: denom, count: count });
          remaining -= denom * count;
        }
      }
      return { parts: result, remainder: remaining };
    }

    function renderBillGrid() {
      els.billGrid.innerHTML = "";
      billJpyEls = {};
      BILLS_VND.forEach(function (denom) {
        var btn = document.createElement("button");
        btn.type = "button";

        var amountEl = document.createElement("span");
        amountEl.className = "bill-amount";
        amountEl.textContent = "+" + fmt(denom);
        btn.appendChild(amountEl);

        var jpyEl = document.createElement("span");
        jpyEl.className = "bill-jpy";
        btn.appendChild(jpyEl);
        billJpyEls[denom] = jpyEl;

        btn.addEventListener("click", function () {
          state.paidTaps.push(denom);
          renderDynamic();
        });
        els.billGrid.appendChild(btn);
      });
    }

    function renderRateHints() {
      var vndPerJpy = state.rates.jpyPerVnd > 0 ? 1 / state.rates.jpyPerVnd : 0;
      var vndPerMmk = state.rates.mmkPerVnd > 0 ? 1 / state.rates.mmkPerVnd : 0;
      els.rateJpyHint.textContent = vndPerJpy ? "(参考: 1円 ≈ " + fmt(Math.round(vndPerJpy)) + "ドン)" : "";
      els.rateMmkHint.textContent = vndPerMmk ? "(参考: 1チャット ≈ " + fmt(Math.round(vndPerMmk)) + "ドン)" : "";
    }

    function renderDynamic() {
      var total = totalVnd();
      var paid = paidVnd();

      var mainCur = CURRENCIES[state.inputCurrency];
      els.totalFlag.textContent = mainCur.flag;
      els.totalLabel.textContent = mainCur.label;
      els.totalNum.textContent = fmt(totalRawValue());

      var others = CURRENCY_ORDER.filter(function (k) { return k !== state.inputCurrency; });
      var conv1 = CURRENCIES[others[0]];
      var conv2 = CURRENCIES[others[1]];
      els.convRow1.className = "conv-row " + others[0];
      els.convFlag1.textContent = conv1.flag;
      els.convLabel1.textContent = conv1.label;
      els.convNum1.textContent = fmt(Math.round(conv1.fromVnd(total)));
      els.convRow2.className = "conv-row " + others[1];
      els.convFlag2.textContent = conv2.flag;
      els.convLabel2.textContent = conv2.label;
      els.convNum2.textContent = fmt(Math.round(conv2.fromVnd(total)));

      BILLS_VND.forEach(function (denom) {
        billJpyEls[denom].textContent = "約" + fmt(Math.round(toJpy(denom))) + "円";
      });

      els.paidTotal.textContent = fmt(paid);

      var tally = {};
      state.paidTaps.forEach(function (d) { tally[d] = (tally[d] || 0) + 1; });
      var denomsDesc = Object.keys(tally).map(Number).sort(function (a, b) { return b - a; });
      els.paidBreakdown.innerHTML = "";
      denomsDesc.forEach(function (d) {
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = fmt(d) + "₫ × " + tally[d];
        els.paidBreakdown.appendChild(chip);
      });

      if (total === 0 && paid === 0) {
        els.changeStatus.hidden = false;
        els.changeStatus.className = "change-status";
        els.changeStatus.textContent = "商品の値段を入力してください";
        els.changeDisplay.hidden = true;
        els.changeBreakdown.innerHTML = "";
        els.remainderNote.hidden = true;
        els.nextBtn.hidden = true;
      } else if (paid < total) {
        var shortfall = total - paid;
        els.changeStatus.hidden = false;
        els.changeStatus.className = "change-status danger";
        els.changeStatus.textContent = "不足しています。あと " + fmt(shortfall) + " ドン 必要です";
        els.changeDisplay.hidden = true;
        els.changeBreakdown.innerHTML = "";
        els.remainderNote.hidden = true;
        els.nextBtn.hidden = true;
      } else {
        var change = paid - total;
        els.changeStatus.hidden = true;
        els.changeDisplay.hidden = false;
        els.changeNum.textContent = fmt(change);
        els.changeBreakdown.innerHTML = "";
        if (change === 0) {
          var zeroChip = document.createElement("span");
          zeroChip.className = "chip";
          zeroChip.textContent = "ちょうどです（お釣りなし）";
          els.changeBreakdown.appendChild(zeroChip);
          els.remainderNote.hidden = true;
        } else {
          var breakdown = greedyBreakdown(change, BILLS_VND);
          breakdown.parts.forEach(function (p) {
            var chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = fmt(p.denom) + "₫ × " + p.count;
            els.changeBreakdown.appendChild(chip);
          });
          if (breakdown.remainder > 0) {
            els.remainderNote.hidden = false;
            els.remainderNote.textContent = "紙幣にない端数: " + fmt(breakdown.remainder) + "₫（約" + fmt(Math.round(toJpy(breakdown.remainder))) + "円）";
          } else {
            els.remainderNote.hidden = true;
          }
        }
        els.nextBtn.hidden = false;
      }
    }

    function pressKey(key) {
      if (key === "clear") {
        state.totalRaw = "";
      } else if (key === "back") {
        state.totalRaw = state.totalRaw.slice(0, -1);
      } else {
        if (state.totalRaw.length >= 12) return;
        if (state.totalRaw === "" || state.totalRaw === "0") {
          state.totalRaw = key === "000" ? "0" : key;
        } else {
          state.totalRaw += key;
        }
      }
      renderDynamic();
    }

    document.querySelectorAll(".total-panel .keypad button").forEach(function (btn) {
      btn.addEventListener("click", function () { pressKey(btn.dataset.key); });
    });

    function updateCurrencyButtons() {
      els.currencySwitch.querySelectorAll(".curr-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.currency === state.inputCurrency);
      });
    }
    els.currencySwitch.querySelectorAll(".curr-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.dataset.currency === state.inputCurrency) return;
        state.inputCurrency = btn.dataset.currency;
        state.totalRaw = "";
        saveInputCurrency();
        updateCurrencyButtons();
        renderDynamic();
      });
    });

    els.undoBtn.addEventListener("click", function () {
      state.paidTaps.pop();
      renderDynamic();
    });
    els.resetPaidBtn.addEventListener("click", function () {
      state.paidTaps = [];
      renderDynamic();
    });
    els.nextBtn.addEventListener("click", function () {
      state.totalRaw = "";
      state.paidTaps = [];
      renderDynamic();
    });

    els.settingsToggle.addEventListener("click", function () {
      var isHidden = els.ratesBody.hasAttribute("hidden");
      if (isHidden) els.ratesBody.removeAttribute("hidden");
      else els.ratesBody.setAttribute("hidden", "");
      els.settingsToggle.setAttribute("aria-expanded", String(isHidden));
    });

    function onRateInput() {
      var j = parseFloat(els.rateJpy.value);
      var m = parseFloat(els.rateMmk.value);
      if (!isNaN(j) && j > 0) state.rates.jpyPerVnd = j;
      if (!isNaN(m) && m > 0) state.rates.mmkPerVnd = m;
      saveRates();
      renderRateHints();
      renderDynamic();
    }
    els.rateJpy.addEventListener("input", onRateInput);
    els.rateMmk.addEventListener("input", onRateInput);

    els.themeToggle.addEventListener("click", function () {
      var next = currentIsDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      refreshThemeIcon();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key >= "0" && e.key <= "9") pressKey(e.key);
      else if (e.key === "Backspace") pressKey("back");
      else if (e.key === "Escape") pressKey("clear");
    });

    loadTheme();
    refreshThemeIcon();
    loadRates();
    loadInputCurrency();
    updateCurrencyButtons();
    els.rateJpy.value = state.rates.jpyPerVnd;
    els.rateMmk.value = state.rates.mmkPerVnd;
    renderRateHints();
    renderBillGrid();
    renderDynamic();
  })();
</script>

</body>
</html>
